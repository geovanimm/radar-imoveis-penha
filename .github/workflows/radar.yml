name: Radar de Imóveis

on:
  workflow_dispatch:
    inputs:
      limpar_tabela:
        description: "Limpar a tabela 'imoveis' antes de rodar (fase de testes)"
        type: boolean
        default: false
  schedule:
    # 11:00 UTC = 08:00 em Penha-SC (horário de Brasília, UTC-3).
    # Rodas agendadas nunca limpam a tabela (só somam/atualizam).
    - cron: "0 11 * * *"

jobs:
  buscar-imoveis:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4

      - name: Executar radar
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Opcional: sem esse secret configurado, o campo observacao_ia
          # dos imóveis novos fica vazio (sem custo, sem erro).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMPAR_TABELA_ANTES: ${{ inputs.limpar_tabela }}
        run: python radar.py
